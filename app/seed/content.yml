        class: App\Elements\SectionContentBlock
        style: FeatureImage
        Title: Feature photo
        ShowTitle: false

      - key: rest-exclusions
        class: App\Elements\SectionContentBlock
        style: Callout
        Title: What we don't do
        ShowTitle: true
        HTML: |-
          <ul>
          <li>Hood, exhaust duct and fan cleaning. This needs a certified hood-cleaning company.</li>
          <li>Grease trap pumping</li>
          <li>Pest control</li>
          <li>Servicing or repairing refrigeration or kitchen equipment</li>
          <li>Work above ladder height</li>
          </ul>

