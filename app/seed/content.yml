              <p>Construction and pre-opening cleans for restaurant fit-outs and renovations, plus deep cleans.</p>
            link: { page: restaurant, text: Learn more }
          - key: hoarding
            Title: Hoarding Cleaning
            ShowTitle: true
            HTML: |-
              <p>Respectful, judgement-free cleanup of cluttered homes, with the scope agreed before we start.</p>
            link: { page: hoarding, text: Learn more }

      # Image: rjnLNuJFins. Alt: "Tower crane over a new building under construction in Burnaby."
      - key: home-industry
        class: App\Elements\SectionContentBlock
        style: IndustryBand
        Eyebrow: Who we work with
        Title: Built for Vancouver's construction industry.
        ShowTitle: true
        HTML: |-
          <ul>
          <li>Contractors</li>
          <li>Developers</li>
          <li>Renovators</li>
          <li>Property Managers</li>
          <li>Designers</li>
          <li>Homeowners</li>
          </ul>
