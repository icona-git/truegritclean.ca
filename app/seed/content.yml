      - key: home-why
        class: App\Elements\BucketsBlock
        style: Checklist
        Eyebrow: Built to deliver
        Title: Why contractors call us
        ShowTitle: true
        buckets:
          - key: construction-focused
            Title: Construction-focused, not a residential maid service
            ShowTitle: true
          - key: hepa
