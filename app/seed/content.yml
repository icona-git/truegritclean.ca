      - key: home-phases
        class: App\Elements\BucketsBlock
        style: Phases
        Eyebrow: The process
        Title: The three phases of a construction clean
        ShowTitle: true
        HTML: |-
          <p>Most builds need more than one clean. Book a single phase, or all three as one package.</p>
        cta: { page: post-construction, text: How post-construction cleaning works }
        buckets:
          # Image: 2ZMe-E2NBZ0. Alt: "Unfinished room with bare drywall and construction dust on the floor."
