              <p>Open on time in a space that's clean.</p>
          - key: contractors
            Title: General contractors
            ShowTitle: true
            HTML: |-
              <p>Hand over a restaurant fit-out ready for the owner's team.</p>
          - key: landlords
            Title: Commercial landlords and property managers
            ShowTitle: true
