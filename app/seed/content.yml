    URLSegment: home
    Title: Home
    ShowInMenus: true
    ShowInTopMenu: true
    ShowInFooterMenu: false
    MetaTitle: Post-Construction Cleaning Vancouver | TrueGrit Clean Co.
    MetaDescription: |-
      Post-construction and renovation cleaning in Vancouver for contractors, developers and homeowners. HEPA dust removal. Written quotes the same day.
    # Hero image: gISfS1zLq7c or jq0HpVncJX8 (gISfS1zLq7c used; jq0HpVncJX8 went to About). Alt: "Black and white interior of a building under construction, light coming through the windows."
    # The tagline under the H1 is Settings > Tagline; the hero buttons use Settings text and the phone number.
    HeroLabel: Cleaning services · Vancouver, BC
    HeroTitle: Post-Construction Cleaning in Vancouver
    HeroContent: |-
      <p>From construction site to move-in ready. Professional post-construction and renovation cleaning for contractors, developers, property managers and homeowners across Vancouver.</p>
    blocks:
      - key: home-services
