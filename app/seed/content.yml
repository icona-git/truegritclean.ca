  # ── 9. Privacy Policy ──────────────────────────────────────────────────────
  # A plain-language template, not legal advice. "[date of launch]" stays visible until launch.
  - key: privacy
    class: Page
    URLSegment: privacy
    Title: Privacy Policy
    ShowInMenus: true
    ShowInTopMenu: false
    ShowInFooterMenu: true
    HideRailNav: true
    MetaTitle: Privacy Policy | TrueGrit Clean Co.
    MetaDescription: |-
      How TrueGrit Clean Co. collects, uses and protects the information you send through our quote form, and how to contact us.
    Content: |-
      <p><em>Effective date: [date of launch]</em></p>
      <p><strong>Who we are.</strong> TrueGrit Clean Co. is a cleaning company in Vancouver, British Columbia. This policy explains how we handle personal information collected through truegritclean.ca. We follow British Columbia's <em>Personal Information Protection Act</em> (PIPA).</p>
      <p><strong>What we collect.</strong> When you request a quote, we collect what you enter in the form: your name, company, phone number, email, project address, project details, and any photos you upload. If you call, text or email us, we keep those messages.</p>
      <p><strong>Why we collect it.</strong> We use your information only to prepare and send your quote, to contact you about your project, to schedule and carry out the work, and for our business records. We don't sell or rent your information, and we don't use it for marketing unless you ask us to.</p>
      <p><strong>Photos.</strong> Photos you upload are used only to quote and plan your job. We won't publish them or share them without your permission.</p>
      <p><strong>Where it's stored and who sees it.</strong> Quote requests are emailed to us and stored in our business email account and on our website's hosting server in Canada. Only the TrueGrit team and our website provider (for maintenance and security) can access it. We use reasonable safeguards to protect it.</p>
      <p><strong>How long we keep it.</strong> We keep quote requests for up to 2 years, and records of completed jobs for as long as tax and business record rules require. After that, we delete them.</p>
      <p><strong>Cookies and analytics.</strong> Our website may use basic cookies and analytics to understand how visitors use the site. These don't identify you personally.</p>
      <p><strong>Your rights.</strong> You can ask to see the personal information we hold about you, ask us to correct it, or ask us to delete it where we're not required to keep it. Email us and we'll respond within 30 days.</p>
      <p><strong>Contact.</strong> Questions about privacy: <a href="mailto:hello@truegritclean.ca">hello@truegritclean.ca</a> · <a href="tel:+18258823881">825-882-3881</a>.</p>
      <p><strong>Changes.</strong> We may update this policy. The current version will always be on this page with its effective date.</p>
