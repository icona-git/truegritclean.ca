  # ── 5. Restaurant Cleaning (whole page: scope to confirm with Rebekah) ─────
  - key: restaurant
    class: App\Pages\PracticeAreaPage
    parent: services
    URLSegment: restaurant-cleaning
    Title: Restaurant Cleaning
    MenuTitle: Restaurant
    ShowInMenus: true
    ShowInTopMenu: false
    ShowInFooterMenu: false
    MetaTitle: Restaurant Cleaning Vancouver | TrueGrit Clean Co.
    MetaDescription: |-
      Construction, pre-opening and deep cleaning for Vancouver restaurants. Fit-outs, renovations, kitchens and dining rooms cleaned before you open the doors.
    HeroLabel: Services · Vancouver, BC
    HeroTitle: Restaurant Cleaning in Vancouver
    HeroContent: |-
      <p>We clean restaurants after a fit-out or renovation, before opening day, and when the space needs a top-to-bottom reset. We work for restaurant owners and operators, and for the contractors building their spaces.</p>
    TeaserContent: |-
      <p>Construction and pre-opening cleans for restaurant fit-outs and renovations, plus deep cleans of dining rooms, kitchens and washrooms.</p>
    blocks:
      - key: rest-intro
        class: App\Elements\SectionContentBlock
        style: ServiceIntro
        Title: Introduction
        ShowTitle: false
        HTML: |-
          <p>A new or renovated restaurant has construction dust on every stainless surface, in every shelf and behind every piece of equipment. We get the kitchen, dining room, bar and washrooms clean enough to open, so your team can start setting up instead of scrubbing.</p>

      - key: rest-when
        class: App\Elements\BucketsBlock
        style: AudienceCards
        Title: When restaurants call us
        ShowTitle: true
        buckets:
          - key: fit-out
            Title: After a fit-out or tenant improvement
            ShowTitle: true
            HTML: |-
              <p>The build is done and the space needs to be cleaned before equipment and staff move in.</p>
          - key: renovation
            Title: After a renovation
            ShowTitle: true
            HTML: |-
              <p>Dust and debris cleaned out of a kitchen or dining room refresh.</p>
          - key: opening
            Title: Before opening or reopening
            ShowTitle: true
            HTML: |-
              <p>A final clean scheduled ahead of your opening date or inspection.</p>
          - key: deep-clean
            Title: Deep clean
            ShowTitle: true
            HTML: |-
              <p>A top-to-bottom reset of a space that needs it.</p>

      - key: rest-included
        class: App\Elements\BucketsBlock
        style: ScopeGroups
        Eyebrow: Detailed scope
        Title: What's included
        ShowTitle: true
        buckets:
          - key: included
            Title: Included
            ShowTitle: false
            HTML: |-
              <ul>
              <li>Construction dust removed front and back of house</li>
              <li>Stainless steel surfaces, prep tables and shelving cleaned and polished</li>
              <li>Kitchen walls and backsplashes washed</li>
              <li>Exteriors of kitchen equipment cleaned, stickers and film removed</li>
              <li>Kitchen floors degreased and mopped</li>
              <li>Dining room, bar and seating areas cleaned</li>
              <li>Washrooms cleaned top to bottom</li>
              <li>Interior windows, glass doors and partitions</li>
              <li>Light fixtures, vents and registers dusted</li>
              </ul>

      # Image: TSvGSPO_Kqk (alternative hG85jQJq-tw). Alt: "Empty commercial kitchen with stainless steel counters and equipment."
