              <p>Get a restaurant unit ready for a new tenant.</p>

      - key: rest-faq
        class: App\Elements\BucketsBlock
        style: Faq
        Eyebrow: Common questions
        Title: Restaurant cleaning FAQs
        ShowTitle: true
        buckets:
          - key: hoods
            Title: Do you clean commercial kitchen hoods and exhaust ducts?
