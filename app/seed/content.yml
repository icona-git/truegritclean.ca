          - key: inspection
            Title: Can you clean before a health inspection or opening day?
            ShowTitle: true
            HTML: |-
              <p>Yes. We'll schedule the final clean ahead of your inspection or opening date. Book as early as you can, because opening dates tend to move.</p>
          - key: after-hours
