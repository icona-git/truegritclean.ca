  # ── 6. Hoarding Cleaning (scope to confirm with Rebekah; no photos on this page) ──
  # No eyebrows except the FAQ: the Figma labels ("Project partners") don't suit this page's tone.
  - key: hoarding
    class: App\Pages\PracticeAreaPage
    parent: services
    URLSegment: hoarding-cleaning
    Title: Hoarding Cleaning
    MenuTitle: Hoarding
    ShowInMenus: true
    ShowInTopMenu: false
    ShowInFooterMenu: false
    MetaTitle: Hoarding Cleanup Vancouver | TrueGrit Clean Co.
    MetaDescription: |-
      Respectful, judgement-free hoarding cleanup in Vancouver. We work at your pace, agree the scope up front and keep everything confidential. Free quote.
    HeroLabel: Services · Vancouver, BC
    HeroTitle: Hoarding Cleanup in Vancouver
    HeroContent: |-
      <p>Hoarding cleanup clears, sorts and cleans a home that has become hard to live in, at a pace and with the discretion that suit the person who lives there. We work with individuals, families, landlords and property managers across Vancouver.</p>
    TeaserContent: |-
      <p>Respectful, judgement-free cleanup of homes that have become hard to live in, with a clear "what we do and don't do" agreed up front.</p>
    blocks:
      - key: hoard-intro
        class: App\Elements\SectionContentBlock
        style: ServiceIntro
        Title: Introduction
        ShowTitle: false
        HTML: |-
          <p>Asking for help with this is hard. We don't judge, we don't lecture, and we don't make decisions about your belongings without you. We agree the plan with you before we start, and we stick to it.</p>

      - key: hoard-how
        class: App\Elements\BucketsBlock
        style: Standards
        Title: How we work
        ShowTitle: true
        buckets:
          - key: no-judgement
            Title: No judgement.
            ShowTitle: true
            HTML: |-
              <p>We've seen it before and we're here to help, not to comment.</p>
          - key: control
            Title: You stay in control.
            ShowTitle: true
            HTML: |-
              <p>Nothing is thrown away without your say-so.</p>
          - key: scope
            Title: Clear scope up front.
            ShowTitle: true
            HTML: |-
              <p>Before we start, we agree in plain language what we'll do and what we won't.</p>
          - key: confidential
            Title: Confidential.
            ShowTitle: true
            HTML: |-
              <p>We don't share details of your home with anyone. We only take photos with your permission, and they're never shared without your consent.</p>
          - key: pace
            Title: At your pace.
            ShowTitle: true
            HTML: |-
              <p>A large cleanup can be done in stages over several visits.</p>

      - key: hoard-do
        class: App\Elements\BucketsBlock
        style: ScopeGroups
        Title: What we do
        ShowTitle: true
        buckets:
          - key: do
            Title: What we do
            ShowTitle: false
            HTML: |-
              <ul>
              <li>Sort through items with you: keep, donate, discard</li>
              <li>Bag and remove garbage and unwanted items</li>
              <li>Clear pathways, rooms and surfaces</li>
              <li>Deep clean kitchens, bathrooms, floors and surfaces once the space is clear</li>
              <li>Get a home ready for a move, an inspection or a sale</li>
              </ul>

      - key: hoard-dont
        class: App\Elements\SectionContentBlock
        style: Callout
        Title: What we don't do
        ShowTitle: true
        HTML: |-
          <p>For everyone's safety, we don't handle:</p>
          <ul>
          <li>Needles or other sharps</li>
          <li>Biohazards, including bodily fluids and significant human or animal waste</li>
          <li>Pest infestations (we'll pause until a pest control company has treated the home)</li>
          <li>Mould remediation</li>
          <li>Trauma or death scenes</li>
          <li>Asbestos or other hazardous materials</li>
          </ul>
          <p>If we find any of these during a job, we stop work in that area and help you find a certified specialist.</p>

      - key: hoard-audiences
        class: App\Elements\BucketsBlock
        style: AudienceCards
        Title: Who this is for
        ShowTitle: true
        buckets:
          - key: residents
            Title: People living with hoarding, and their families
            ShowTitle: true
            HTML: |-
              <p>Practical help to make a home safe and livable again.</p>
          - key: landlords
            Title: Landlords and property managers
            ShowTitle: true
            HTML: |-
              <p>A unit cleared and cleaned for the tenant, or for a turnover.</p>
          - key: support
            Title: Support workers and housing providers
            ShowTitle: true
            HTML: |-
              <p>A cleaning partner who treats residents with respect.</p>

      - key: hoard-faq
        class: App\Elements\BucketsBlock
        style: Faq
        Eyebrow: Common questions
        Title: Hoarding cleanup FAQs
        ShowTitle: true
        buckets:
          - key: belongings
            Title: Will you throw my things away without asking?
            ShowTitle: true
            HTML: |-
              <p>No. We sort through items with you and nothing is discarded without your agreement.</p>
          - key: biohazards
            Title: Do you handle needles, biohazards or animal waste?
            ShowTitle: true
            HTML: |-
              <p>No. Sharps, bodily fluids, significant human or animal waste, mould and pest infestations need certified specialists. If we find them, we stop and help you find the right company.</p>
          - key: duration
            Title: How long does a hoarding cleanup take?
            ShowTitle: true
            HTML: |-
              <p>It depends on the size of the home and how much needs to be sorted. Some jobs take a day, others take several visits. We'll give you an estimate after seeing photos or doing a walkthrough.</p>
          - key: on-behalf
            Title: Can a family member or landlord book on someone's behalf?
            ShowTitle: true
            HTML: |-
              <p>Yes. We do need the resident's agreement before we start, and we work with them directly on what's kept.</p>
          - key: confidential
            Title: Is it confidential?
            ShowTitle: true
            HTML: |-
              <p>Yes. We don't discuss your home or your situation with anyone, and we don't post photos of your home.</p>

