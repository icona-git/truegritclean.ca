# Launch content for truegritclean.ca, read by App\Tasks\SeedTask (vendor/bin/sake tasks:seed).
#
# Copy source: content/TrueGrit-Website-Content.md, Draft v1 (Nov 23, 2026), in the project docs folder above this repo.
# The copy is verbatim, minus the [bracketed] notes for Rebekah. Eyebrows, the quote panel heading and FAQ section
# headings come from the Figma export (design/figma-export), or follow its pattern where the export has no such page.
# Claims (Settings > Claims) are never seeded: items that state one carry "claims:", and the $475 sentence is wrapped
# in [claim key=minimum]...[/claim], so they stay hidden until the box is ticked.
#
# Page keys: a page's "key" is this file's own name for it (parents and links use it). Every other key on a page,
# block or bucket is a database field. Block and bucket keys become their SeedKey (unique within the page / block).
# Photos are attached by tasks:seed-images from app/seed/images.yml (file, alt text, slot); the comments below name
# each slot's Unsplash photo as the content doc gives it.

siteconfig:
  Title: TrueGrit Clean Co.
  Tagline: True Grit. Real Work. Spotless Results.
  Phone: 825-882-3881
  Email: hello@truegritclean.ca
  # City and province only: Google requires an address on a LocalBusiness type (ProfessionalService is one), and
  # service_area_business (app/_config/seo.yml) keeps any street address and postal code out of the schema.
  # No template prints these two fields.
  City: Vancouver
  Province: BC
  # The line break matches the Figma footer; the field keeps it.
  ServiceArea: |-
    Vancouver and nearby
    Lower Mainland communities
  FooterExclusions: |-
    We don't handle asbestos, lead, mould remediation, sharps, biohazards, bodily fluids or trauma scenes, or work above ladder height. We're happy to refer you to a certified specialist.
  # tasks:seed-images replaces this sentence with the full credits line (app/seed/images.yml) while nobody has edited it.
  PhotoCredits: |-
    Some photos on this site are from Unsplash and show general construction scenes, not TrueGrit jobs.
  BookingBannerTitle: |-
    Let's tackle the grime.
  BookingBannerBody: |-
    Send the address and a few photos, and you'll have a written quote the same business day.
  BookingBannerButtonText: Get a free quote
  BookingBannerPhoneText: or call or text

pages:

