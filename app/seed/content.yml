  # ── 2. Services overview ───────────────────────────────────────────────────
  - key: services
    class: App\Pages\TopLevelPage
    URLSegment: services
    Title: Services
    ShowInMenus: true
    ShowInTopMenu: true
    ShowInFooterMenu: true
    MetaTitle: Construction Cleaning Vancouver | TrueGrit Clean Co.
    MetaDescription: |-
      Post-construction, renovation, restaurant and hoarding cleaning in Vancouver. Rough, final and touch-up cleans for contractors. Free written quotes.
    HeroTitle: Construction Cleaning Services in Vancouver
    HeroContent: |-
      <p>TrueGrit Clean Co. cleans up after construction and renovation work in Vancouver, from the first rough clean to the last touch-up before handover. We work mainly for general contractors, builders, developers and property managers, and for homeowners finishing a project.</p>
    blocks:
      # Lists the service pages: each card's text is that page's Teaser Text.
      - key: services-list
        class: App\Elements\SpecialListBlock
        style: Services
        Eyebrow: Specialist cleaning
        Title: Our services
        ShowTitle: true

      - key: services-phases
        class: App\Elements\SectionContentBlock
        Eyebrow: The process
        Title: |-
          How a construction clean is staged: Rough → Final → Touch-up
        ShowTitle: true
        HTML: |-
          <table>
          <thead>
          <tr><th scope="col">Phase</th><th scope="col">When</th><th scope="col">What gets done</th></tr>
          </thead>
          <tbody>
          <tr><th scope="row">Rough clean</th><td>While trades are still working</td><td>Debris, cardboard and packaging out. Heavy dust vacuumed. Sills, frames and vents cleared. The site is ready for finishing trades.</td></tr>
          <tr><th scope="row">Final clean</th><td>After construction ends</td><td>Detailed top-to-bottom clean: walls, trim, cabinets inside and out, glass, kitchens, bathrooms, floors. Move-in ready.</td></tr>
          <tr><th scope="row">Touch-up clean</th><td>Right before inspection, staging, photos or handover</td><td>Newly settled dust, fingerprints and footprints from deficiency work removed. A final walkthrough with you.</td></tr>
          </tbody>
          </table>

      - key: services-packages
        class: App\Elements\SectionContentBlock
        Title: Packages for builders and developers
        ShowTitle: true
        HTML: |-
          <p>Book all three phases as one project and we'll schedule each clean around your construction timeline. We quote multi-unit buildings by the project, not one unit at a time.</p>

      - key: services-exclusions
        class: App\Elements\SectionContentBlock
        style: Callout
        Title: What we don't do
        ShowTitle: true
        HTML: |-
          <p>Asbestos, lead, mould remediation, sharps, biohazards, bodily fluids, trauma scenes, large or heavy construction waste, and work above ladder height. We'll point you to a certified specialist.</p>

      - key: services-faq
        class: App\Elements\BucketsBlock
        style: Faq
        Eyebrow: FAQ
        Title: Common questions
        ShowTitle: true
        buckets:
          - key: one-phase
            Title: Can I book just one phase?
            ShowTitle: true
            HTML: |-
              <p>Yes. Many contractors book only a final clean, or only a touch-up before handover. Tell us where the project is at and we'll quote the phase you need.</p>
          - key: commercial
            Title: Do you clean commercial spaces?
            ShowTitle: true
            HTML: |-
              <p>Yes. We clean offices, retail units, restaurants and other commercial spaces after construction and renovation work.</p>
          - key: equipment
            Title: Do you bring your own equipment and supplies?
            ShowTitle: true
            HTML: |-
              <p>Yes. We bring our own HEPA vacuums, cleaning products and tools. We do need power and running water on site.</p>
          - key: power-water
            Title: Do you need power and water on site?
            ShowTitle: true
            HTML: |-
              <p>Yes, in most cases. HEPA vacuums need power and a proper clean needs running water. If either isn't connected yet, mention it in your quote request and we'll plan around it.</p>

  # ── 3. Post-Construction Cleaning ──────────────────────────────────────────
  - key: post-construction
    class: App\Pages\PracticeAreaPage
    parent: services
    URLSegment: post-construction-cleaning
    Title: Post-Construction Cleaning
    MenuTitle: Post-Construction
    ShowInMenus: true
    ShowInTopMenu: false
    ShowInFooterMenu: false
    MetaTitle: Post-Construction Cleaning Vancouver | Free Quote
    MetaDescription: |-
      Construction site to move-in ready. Detailed post-construction cleaning for contractors, developers and homeowners in Vancouver.
    # Hero image: the content doc names none for this page, so the hero is the plain charcoal one (the Figma service
    # hero used the concrete-grinding photo, which is this page's feature photo below).
    HeroLabel: Services · Vancouver, BC
    HeroTitle: Post-Construction Cleaning Vancouver
    HeroContent: |-
      <p>Post-construction cleaning removes the dust, debris, stickers and residue trades leave behind, taking a new build or major renovation from construction site to handover ready. We do it for general contractors, builders, developers, property managers and homeowners across Vancouver.</p>
    TeaserContent: |-
      <p>Our core service. Rough, final and touch-up cleans that take a new build or major renovation from construction site to handover ready, with HEPA dust removal throughout.</p>
    blocks:
      - key: pc-intro
        class: App\Elements\SectionContentBlock
        style: ServiceIntro
        Title: Introduction
        ShowTitle: false
        HTML: |-
          <p>When the trades finish, the dust doesn't. Fine drywall and construction dust settles into every surface, track and vent in the building, and it keeps settling for days after the last tool leaves. We remove it properly, with sealed HEPA equipment built for construction sites, so the property is ready for inspection, photography and handover.</p>

      - key: pc-phases
        class: App\Elements\BucketsBlock
        style: ServicePhases
        Eyebrow: A complete construction clean
        Title: The three phases
        ShowTitle: true
        buckets:
          - key: rough
            Title: Rough clean
            ShowTitle: true
            HTML: |-
              <p>This happens while construction is wrapping up, before the detailed final clean:</p>
              <ul>
              <li>Remove loose construction debris</li>
              <li>Remove cardboard and packaging</li>
              <li>Remove protective materials where authorized</li>
              <li>Sweep and HEPA-vacuum floors</li>
              <li>Vacuum construction and drywall dust</li>
              <li>Dust walls and major surfaces</li>
              <li>Clean window sills and frames</li>
              <li>Vacuum accessible vents and registers</li>
              <li>Dispose of waste in the site's designated construction bins</li>
              </ul>
          - key: final
            Title: Final clean
            ShowTitle: true
            HTML: |-
              <p>This takes the property from construction site to move-in or handover ready. The full checklist is below.</p>
          - key: touch-up
            Title: Touch-up clean
            ShowTitle: true
            HTML: |-
              <p>This happens right before inspection, staging, photography, handover or move-in:</p>
              <ul>
              <li>Remove newly settled dust</li>
              <li>Spot-clean windows and glass</li>
              <li>Remove fingerprints</li>
              <li>Polish fixtures</li>
              <li>Touch up floors, countertops, kitchens and bathrooms</li>
              <li>Check corners and baseboards</li>
              <li>Final walkthrough</li>
              <li>Completion photos</li>
              </ul>

      - key: pc-included
        class: App\Elements\BucketsBlock
        style: ScopeGroups
        Eyebrow: Detailed scope
        Title: What's included in a final clean
        ShowTitle: true
        buckets:
          - key: dust
            Title: Dust removal
            ShowTitle: true
            HTML: |-
              <ul>
              <li>HEPA vacuum all surfaces</li>
              <li>Dust walls and ceilings where safely accessible</li>
              <li>Baseboards, trim and mouldings</li>
              <li>Doors and door frames</li>
              <li>Railings, shelving and closets</li>
              <li>Switch plates and outlet covers</li>
              <li>Light fixtures</li>
              <li>Vents and registers</li>
              </ul>
          - key: windows
            Title: Windows and glass
            ShowTitle: true
            HTML: |-
              <ul>
              <li>Interior glass</li>
              <li>Window frames, tracks and sills</li>
              <li>Mirrors, glass doors and partitions</li>
              <li>Sticker and protective film removal</li>
              <li>Light adhesive residue removal</li>
              <li>Paint and plaster spot removal where it can be done safely without damaging the surface</li>
              </ul>
          - key: kitchen
            Title: Kitchen
            ShowTitle: true
            HTML: |-
              <ul>
              <li>Countertops and backsplash</li>
              <li>Sink and faucet</li>
              <li>Cabinets inside and out</li>
              <li>Drawers and pantry</li>
              <li>Appliance exteriors (interiors on request)</li>
              <li>Appliance sticker and film removal</li>
              <li>Stainless steel polishing</li>
              </ul>
          - key: bathrooms
            Title: Bathrooms
            ShowTitle: true
            HTML: |-
              <ul>
              <li>Toilets, sinks and faucets</li>
              <li>Bathtubs, showers and shower glass</li>
              <li>Mirrors, vanities and cabinets</li>
              <li>Tile and grout residue</li>
              <li>Fixture polishing</li>
              </ul>
          - key: floors
            Title: Floors
            ShowTitle: true
            HTML: |-
              <ul>
              <li>HEPA vacuum throughout</li>
              <li>Mop all hard flooring</li>
              <li>Vacuum carpets</li>
              <li>Edges, corners and baseboard detail</li>
              <li>Light construction residue removal</li>
              </ul>

      - key: pc-audiences
        class: App\Elements\BucketsBlock
        style: AudienceCards
        Eyebrow: Project partners
        Title: Who this is for
        ShowTitle: true
        buckets:
          - key: contractors
            Title: General contractors and builders
            ShowTitle: true
            HTML: |-
              <p>Hand over a clean, finished property without pulling your crew off the next job.</p>
          - key: developers
            Title: Developers and property managers
            ShowTitle: true
            HTML: |-
              <p>Units cleaned to the same standard, scheduled around your occupancy dates.</p>
          - key: homeowners
            Title: Homeowners
            ShowTitle: true
            HTML: |-
              <p>Finishing a build or major renovation? Move into a home that's actually clean, not just swept.</p>

      # Image: t9eQm2y1tn8. Alt: "Worker grinding concrete on a construction site, with dust in the air."
      - key: pc-image
        class: App\Elements\SectionContentBlock
        style: FeatureImage
        Title: Feature photo
        ShowTitle: false

      - key: pc-not-included
        class: App\Elements\SectionContentBlock
        style: Callout
        Title: Not included
        ShowTitle: true
        HTML: |-
          <p>Asbestos, lead, mould remediation and other hazardous materials. Large or heavy construction waste and bin hauling. Work above ladder height. We'll refer you to a qualified contractor.</p>

      - key: pc-faq
        class: App\Elements\BucketsBlock
        style: Faq
        Eyebrow: Common questions
        Title: Post-construction cleaning FAQs
        ShowTitle: true
        buckets:
          - key: cost
            Title: How much does post-construction cleaning cost in Vancouver?
            ShowTitle: true
            HTML: |-
              <p>It depends on square footage, how much dust the site has, and which of the three phases you need. [claim key=minimum]Jobs start at a $475 minimum.[/claim] Send us the address and a few photos and you'll have a firm written quote the same business day.</p>
          - key: rough-vs-final
            Title: What's the difference between a rough clean and a final clean?
            ShowTitle: true
            HTML: |-
              <p>A rough clean happens while trades are still working: debris, packaging and heavy dust are removed so finishing work can go ahead. A final clean happens after construction ends and takes the property to move-in ready, with every window, cabinet, bathroom and floor done in detail.</p>
          - key: hazardous
            Title: Do you handle asbestos or hazardous materials?
            ShowTitle: true
            HTML: |-
              <p>No. Asbestos, lead and mould abatement require specialised certification. We'll refer you to a qualified contractor.</p>
          - key: notice
            Title: How far in advance should I book?
            ShowTitle: true
            HTML: |-
              <p>A week's notice is ideal, especially near month-end when handovers cluster. We take rush work when the schedule allows.</p>

