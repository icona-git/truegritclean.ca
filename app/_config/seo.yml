---
Name: app-seo
After:
  - sitetree-seo
---
# Site-wide SEO head layer (title pattern, description fallback, canonical, Open Graph,
# JSON-LD enrichment). Runs after syntro/silverstripe-seo so it can adjust that module's output.
# See app/src/Extensions/SEOMetaExtension.php.
SilverStripe\CMS\Model\SiteTree:
  extensions:
    - App\Extensions\SEOMetaExtension

App\Extensions\SEOMetaExtension:
  # schema.org type of the site-wide business node (the starter's default, LegalService, is for law firms).
  business_type: ProfessionalService
  # A service-area business: the schema never carries a street address or postal code, even if one is
  # typed into Settings > Contact Info.
  service_area_business: true
  # Feeds the business node's areaServed and every Service node. Set per site, e.g.
  #   area_served:
  #     - Calgary
  #     - Alberta
  # Empty = the property is left out of the schema.
  area_served:
    - Vancouver
    - Lower Mainland
  # <title> suffix for blog posts (the full firm name pushes most post titles past 60 chars).
  # Empty = blog posts use the SiteConfig title like every other page.
  short_brand: ''
  og_locale: en_CA
  schema_language: en-CA
